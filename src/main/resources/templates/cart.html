<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarsanaMart - Cart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .cart {
            width: 80%;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        .cart-item {
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }

        .cart-item h2 {
            margin: 0 0 10px;
        }

        .price {
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 30px;
        }
    </style>
</head>

<body>

<header>
    <h1>DarsanaMart</h1>
    <p>Shopping Cart</p>
</header>

<div class="cart">

    <div class="cart-item" th:each="item : ${cartItems}">
        <h2 th:text="${item.productName}">Product Name</h2>

        <p>
            Quantity:
            <span th:text="${item.quantity}">0</span>
        </p>

        <p class="price">
            ₹<span th:text="${item.price}">0.00</span>
        </p>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(cartItems)}">
        <p>Your cart is empty.</p>
    </div>

</div>

</body>
</html>
