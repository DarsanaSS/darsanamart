<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DarsanaMart - Checkout</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        header {
            background-color: green;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .checkout {
            width: 80%;
            margin: 30px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        .item {
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }

        .total {
            text-align: right;
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }

        button {
            display: block;
            margin: 25px 0 0 auto;
            padding: 12px 25px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>

<header>
    <h1>DarsanaMart</h1>
    <p>Checkout</p>
</header>

<div class="checkout">

    <h2>Order Summary</h2>

    <div class="item" th:each="item : ${cartItems}">

        <h3 th:text="${item.productName}">
            Product Name
        </h3>

        <p>
            Quantity:
            <span th:text="${item.quantity}">1</span>
        </p>

        <p>
            Price: ₹<span th:text="${item.price}">0</span>
        </p>

    </div>

    <div class="total">
        Total: ₹<span th:text="${total}">0</span>
    </div>

    <form action="/order/place" method="post">

        <button type="submit">
            Place Order
        </button>

    </form>

</div>

</body>
</html>
