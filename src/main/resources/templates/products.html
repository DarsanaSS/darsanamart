<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarsanaMart - Products</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 30px;
            justify-content: center;
        }

        .product {
            background: white;
            width: 220px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            text-align: center;
        }

        .product h2 {
            margin-bottom: 10px;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>DarsanaMart</h1>
    <p>Our Products</p>
</header>

<div class="products">

    <div class="product" th:each="product : ${products}">
        <h2 th:text="${product.name}">Product Name</h2>

        <p class="price">
            ₹<span th:text="${product.price}">0.00</span>
        </p>

        <p>
            Quantity:
            <span th:text="${product.quantity}">0</span>
        </p>
    </div>

</div>

</body>
</html>
