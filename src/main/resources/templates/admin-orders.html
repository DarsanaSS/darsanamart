<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DarsanaMart - Orders</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
        }

        header {
            background-color: green;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 90%;
            margin: 30px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: green;
            color: white;
        }

        .back-button {
            display: block;
            width: 200px;
            margin: 25px auto 0;
            padding: 12px;
            background-color: #555;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>

</head>

<body>

<header>
    <h1>DarsanaMart</h1>
    <p>Customer Orders</p>
</header>

<div class="container">

    <h2>Orders</h2>

    <table>

        <thead>
            <tr>
                <th>Order ID</th>
                <th>Username</th>
                <th>Product ID</th>
                <th>Product Name</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Total Amount</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="order : ${orders}">

                <td th:text="${order.id}"></td>

                <td th:text="${order.username}"></td>

                <td th:text="${order.productId}"></td>

                <td th:text="${order.productName}"></td>

                <td th:text="${order.quantity}"></td>

                <td>
                    ₹<span th:text="${order.price}"></span>
                </td>

                <td>
                    ₹<span th:text="${order.total}"></span>
                </td>

            </tr>

        </tbody>

    </table>

    <a href="/admin" class="back-button">
        Back to Admin Dashboard
    </a>

</div>

</body>

</html>
